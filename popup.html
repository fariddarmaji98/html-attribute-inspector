<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 220px; margin: 0; padding: 14px; font: 13px system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 10px; }
  button {
    flex: 1; padding: 8px; border: none; border-radius: 5px;
    background: #ff6a00; color: #fff; font-weight: 600; cursor: pointer;
  }
  button.off { background: #555; }
  p { margin: 10px 0 0; color: #666; font-size: 11px; }
</style>
</head>
<body>
  <div class="row"><button id="toggle">Activate</button></div>
  <p>Hover element &rarr; see attributes. Click element &rarr; lock. Esc &rarr; exit.</p>
  <script src="popup.js"></script>
</body>
</html>
